name: macOS

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Resources/**', 'Makefile', 'Package.swift', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'Resources/**', 'Makefile', 'Package.swift', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build and verify app bundle
        run: |
          make app
          codesign --verify --deep --strict "$HOME/Library/Caches/WisperCloneBuild/WisperClone.app"
